<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Thinking Space - Your personal workspace for notes, tasks, and ideas" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Thinking Space" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Thinking Space" />
    <meta property="og:description" content="Your personal workspace for notes, tasks, and ideas" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply appearance before first paint (no flash of the wrong theme).
      // Mirrors src/lib/appearance.js, ThemeContext ('theme') and EinkContext ('eink-mode').
      (function () {
        var root = document.documentElement;
        var store = {};
        var theme = null;
        var eink = null;
        try {
          store = JSON.parse(localStorage.getItem('appearance')) || {};
          theme = localStorage.getItem('theme');
          eink = localStorage.getItem('eink-mode');
        } catch (e) { /* storage unavailable: defaults */ }
        var attrs = { scheme: 'data-scheme', bodyFont: 'data-body-font', headingFont: 'data-heading-font', textSize: 'data-text-size', background: 'data-background' };
        var defaults = { scheme: 'classic', bodyFont: 'inter', headingFont: 'serif', textSize: 'default', background: 'soft' };
        for (var key in attrs) {
          var value = store[key];
          root.setAttribute(attrs[key], typeof value === 'string' && /^[a-z]{1,20}$/.test(value) ? value : defaults[key]);
        }
        var schemeAccent = { classic: 'graphite', paper: 'amber', sage: 'green', slate: 'blue', midnight: 'indigo', ocean: 'teal', blush: 'rose', lavender: 'violet' };
        root.setAttribute('data-accent', schemeAccent[root.getAttribute('data-scheme')] || 'graphite');
        if (store.bodyFont === 'literata') {
          var link = document.createElement('link');
          link.id = 'font-literata';
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap';
          document.head.appendChild(link);
        }
        var matches = function (query) { return !!(window.matchMedia && window.matchMedia(query).matches); };
        var einkOn = eink === 'true' || (eink !== 'false' && matches('(monochrome)'));
        var dark = !einkOn && (theme === 'dark' || (theme !== 'light' && matches('(prefers-color-scheme: dark)')));
        root.classList.toggle('eink', einkOn);
        root.classList.toggle('dark', dark);
      })();
    </script>
    <title>Thinking Space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
